<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图片预处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .upload-area i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .upload-area p {
            color: #666;
            font-size: 16px;
        }
        
        .upload-area small {
            color: #999;
        }
        
        #fileInput, #douFileInput {
            display: none;
        }
        
        .config-section {
            margin-top: 20px;
        }
        
        .config-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .config-item {
            display: flex;
            flex-direction: column;
        }
        
        .config-item label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .config-item input[type="number"],
        .config-item input[type="checkbox"],
        .config-item input[type="password"] {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .config-item input[type="number"]:focus,
        .config-item input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .config-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: none;
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }
        
        .canvas-cell.highlighted {
            outline: 3px solid #ff6b6b;
            outline-offset: 2px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { outline-color: #ff6b6b; }
            50% { outline-color: #ff8787; }
        }
        
        .used-colors-panel {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #eee;
        }
        
        .used-colors-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .used-colors-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .used-color-item {
            display: flex;
            align-items: center;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        
        .used-color-item:hover {
            background: #f8f9fa;
        }
        
        .used-color-item.active {
            background: #e8f4fd;
        }
        
        .used-color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid #ddd;
        }
        
        .used-color-code {
            font-weight: 600;
            color: #333;
            width: 45px;
            font-size: 12px;
        }
        
        .used-color-count {
            color: #666;
            font-size: 12px;
            margin-left: auto;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .editor {
            display: none;
        }
        
        .editor.show {
            display: block;
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .image-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }
        
        .image-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .image-card .image-header {
            padding: 12px 15px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .image-card .image-header h3 {
            font-size: 14px;
            color: #555;
            margin: 0;
        }
        
        .image-card img {
            width: 100%;
            display: block;
            max-height: 300px;
            object-fit: contain;
        }
        
        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .download-btn:hover {
            background: #5a6fd6;
        }
        
        .stats-section {
            margin-top: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stat-card .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .color-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .color-item:hover {
            background: #f8f9fa;
        }
        
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            margin-right: 12px;
            border: 1px solid #ddd;
        }
        
        .color-code {
            font-weight: 600;
            color: #333;
            width: 50px;
        }
        
        .color-count {
            color: #666;
            margin-left: auto;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab:not(.active) {
            background: #f0f0f0;
            color: #666;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        
        .canvas-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            overflow: auto;
        }
        
        .editor-canvas {
            display: grid;
            gap: 1px;
            background: #ddd;
            border-radius: 8px;
            margin: 0 auto;
        }
        
        .canvas-cell {
            width: 24px;
            height: 24px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        
        .canvas-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .canvas-cell.selected {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
        
        .canvas-cell.transparent {
            background: #fff;
            border: 1px dashed #ccc;
        }
        
        .color-picker-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }
        
        .color-picker-grid {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }
        
        .color-group {
            margin-bottom: 15px;
        }
        
        .color-group-header {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            padding-left: 5px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 4px;
        }
        
        .color-group-colors {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        
        .color-picker-item {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        
        .color-picker-item:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .color-picker-item.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.3);
        }
        
        .color-picker-item.transparent-option {
            background: repeating-linear-gradient(
                45deg,
                #fff,
                #fff 2px,
                #ddd 2px,
                #ddd 4px
            );
        }
        
        .editor-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .compare-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .compare-panel {
            text-align: center;
        }
        
        .compare-panel img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        .compare-panel h4 {
            margin-bottom: 10px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .config-row {
                grid-template-columns: 1fr;
            }
            
            .images-grid {
                grid-template-columns: 1fr;
            }
            
            .editor-grid {
                grid-template-columns: 1fr;
            }
            
            .compare-view {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 拼豆图片预处理工具</h1>
            <p>将图片转换为国产221色拼豆色卡映射</p>
        </div>
        
        <div class="card" id="mainCard">
            <div class="upload-area" id="uploadArea">
                <i>📷</i>
                <p>点击或拖拽上传图片</p>
                <small>支持 JPG、PNG 格式</small>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #eee;">
                <div class="upload-area" id="douUploadArea" style="padding: 20px;">
                    <i>📄</i>
                    <p>或上传 .dou 模板文件进行编辑</p>
                    <input type="file" id="douFileInput" accept=".dou">
                </div>
            </div>
            
            <div class="config-section">
                <div class="config-row">
                    <div class="config-item">
                        <label for="size">下采样长边分辨率</label>
                        <input type="number" id="size" value="52" min="10" max="100">
                    </div>
                    <div class="config-item checkbox-label">
                        <input type="checkbox" id="simplify">
                        <label for="simplify">启用颜色简化模式</label>
                    </div>
                    <div class="config-item">
                        <label for="minCount">最小豆子数量阈值（<=此值的颜色将被合并）</label>
                        <input type="number" id="minCount" value="3" min="1" max="20">
                    </div>
                </div>
                
                <div class="config-row" id="aiConfig" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #eee;">
                    <div class="config-item">
                        <label for="apiKey">火山引擎API Key</label>
                        <input type="password" id="apiKey" placeholder="请输入您的火山引擎API Key">
                    </div>
                </div>
                
                <div class="checkbox-label" style="margin-top: 10px;">
                    <input type="checkbox" id="useAI">
                    <label for="useAI">启用火山引擎AI图像优化（主体识别、遮挡补全、卡通风格转换）</label>
                </div>
                
                <button class="btn" id="processBtn" disabled>开始处理</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理图片...</p>
            </div>
        </div>
        
        <div class="card results" id="results">
            <div class="section-title">处理结果</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="originalSize">-</div>
                    <div class="stat-label">原图尺寸</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="downsampledSize">-</div>
                    <div class="stat-label">降采样尺寸</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="colorCount">-</div>
                    <div class="stat-label">颜色种类</div>
                </div>
            </div>
            
            <div class="images-grid">
                <div class="image-card" id="aiProcessedCard" style="display: none;">
                    <div class="image-header">
                        <h3>AI优化后的图片</h3>
                        <button class="download-btn" data-type="ai_processed">下载</button>
                    </div>
                    <img id="aiProcessedImg" alt="AI优化后的图片">
                </div>
                <div class="image-card">
                    <div class="image-header">
                        <h3>低分辨率图</h3>
                        <button class="download-btn" data-type="low_res">下载</button>
                    </div>
                    <img id="lowResImg" alt="低分辨率图">
                </div>
                <div class="image-card">
                    <div class="image-header">
                        <h3>马赛克效果</h3>
                        <button class="download-btn" data-type="mosaic">下载</button>
                    </div>
                    <img id="mosaicImg" alt="马赛克效果">
                </div>
                <div class="image-card">
                    <div class="image-header">
                        <h3>颜色映射图</h3>
                        <button class="download-btn" data-type="color_map">下载</button>
                    </div>
                    <img id="colorMapImg" alt="颜色映射图">
                </div>
                <div class="image-card" id="originalColorMapCard" style="display: none;">
                    <div class="image-header">
                        <h3>简化前颜色映射图</h3>
                        <button class="download-btn" data-type="original_color_map">下载</button>
                    </div>
                    <img id="originalColorMapImg" alt="简化前颜色映射图">
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn btn-secondary" id="editTemplateBtn">编辑模板</button>
                <button class="btn" id="downloadDouBtn">下载 .dou 文件</button>
            </div>
            
            <div class="stats-section">
                <div class="tabs">
                    <button class="tab active" data-tab="colorCounts">颜色统计</button>
                    <button class="tab" data-tab="originalColorCounts" id="originalColorCountsTab" style="display: none;">简化前颜色统计</button>
                </div>
                
                <div class="tab-content active" id="colorCounts">
                    <div class="color-list" id="colorCountsList"></div>
                </div>
                <div class="tab-content" id="originalColorCounts">
                    <div class="color-list" id="originalColorCountsList"></div>
                </div>
            </div>
        </div>
        
        <div class="card editor" id="editor">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="section-title" style="margin: 0;">模板编辑器</h2>
                <button class="btn btn-secondary btn-small" id="backBtn">返回</button>
            </div>
            
            <div class="editor-grid">
                <div class="canvas-container">
                    <div class="editor-canvas" id="editorCanvas"></div>
                </div>
                
                <div class="color-picker-panel">
                    <h4 style="margin-bottom: 15px;">选择颜色</h4>
                    <div class="color-picker-grid" id="colorPickerGrid"></div>
                    
                    <div class="used-colors-panel" id="usedColorsPanel">
                        <div class="used-colors-title">已使用颜色 (点击高亮)</div>
                        <div class="used-colors-list" id="usedColorsList"></div>
                    </div>
                    
                    <div class="editor-actions">
                        <button class="btn btn-danger" id="deleteSelectedBtn">删除选中格点</button>
                        <button class="btn" id="applyColorBtn">应用颜色到选中区域</button>
                        <button class="btn btn-secondary" id="clearHighlightBtn">清除高亮</button>
                        <button class="btn btn-secondary" id="compareBtn">对比编辑前后</button>
                        <button class="btn" id="downloadEditedDouBtn">下载编辑后的 .dou 文件</button>
                        <button class="btn btn-secondary" id="previewEditedBtn">预览编辑后的图片</button>
                    </div>
                </div>
            </div>
            
            <div class="compare-view" id="compareView" style="display: none; margin-top: 30px;">
                <div class="compare-panel">
                    <h4>编辑前</h4>
                    <img id="beforePreview" alt="编辑前">
                </div>
                <div class="compare-panel">
                    <h4>编辑后</h4>
                    <img id="afterPreview" alt="编辑后">
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const douUploadArea = document.getElementById('douUploadArea');
        const fileInput = document.getElementById('fileInput');
        const douFileInput = document.getElementById('douFileInput');
        const processBtn = document.getElementById('processBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const editor = document.getElementById('editor');
        const mainCard = document.getElementById('mainCard');
        
        let uploadedFile = null;
        let currentImages = {};
        let currentDouData = null;
        let originalDouData = null;
        let selectedCells = [];
        let mardColors = {};
        
        fetch('/get-colors')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    mardColors = data.colors;
                }
            });
        
        uploadArea.addEventListener('click', () => fileInput.click());
        douUploadArea.addEventListener('click', () => douFileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        douFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleDouFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }
            uploadedFile = file;
            processBtn.disabled = false;
            uploadArea.innerHTML = `
                <i>✅</i>
                <p>已选择: ${file.name}</p>
                <small>点击更换图片</small>
            `;
        }
        
        function handleDouFile(file) {
            if (!file.name.endsWith('.dou')) {
                alert('请上传 .dou 文件');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const douData = JSON.parse(e.target.result);
                    loadDouData(douData);
                } catch (err) {
                    alert('无效的 .dou 文件');
                }
            };
            reader.readAsText(file);
        }
        
        document.getElementById('useAI').addEventListener('change', () => {
            const aiConfig = document.getElementById('aiConfig');
            aiConfig.style.display = document.getElementById('useAI').checked ? 'block' : 'none';
        });
        
        processBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;
            
            const size = document.getElementById('size').value;
            const simplify = document.getElementById('simplify').checked;
            const minCount = document.getElementById('minCount').value;
            const useAI = document.getElementById('useAI').checked;
            const apiKey = document.getElementById('apiKey').value;
            
            if (useAI && !apiKey) {
                alert('请输入火山引擎API Key');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', uploadedFile);
            formData.append('size', size);
            formData.append('simplify', simplify);
            formData.append('min_count', minCount);
            formData.append('ai', useAI);
            formData.append('api_key', apiKey);
            
            loading.classList.add('show');
            results.classList.remove('show');
            editor.classList.remove('show');
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentImages = data.images;
                    currentDouData = data.dou_data;
                    originalDouData = JSON.parse(JSON.stringify(data.dou_data));
                    
                    document.getElementById('originalSize').textContent = 
                        `${data.original_size[0]} × ${data.original_size[1]}`;
                    document.getElementById('downsampledSize').textContent = 
                        `${data.downsampled_size[0]} × ${data.downsampled_size[1]}`;
                    document.getElementById('colorCount').textContent = 
                        Object.keys(data.color_counts).length;
                    
                    if (data.images.ai_processed) {
                        document.getElementById('aiProcessedImg').src = 
                            'data:image/png;base64,' + hexToBase64(data.images.ai_processed);
                        document.getElementById('aiProcessedCard').style.display = 'block';
                    } else {
                        document.getElementById('aiProcessedCard').style.display = 'none';
                    }
                    
                    document.getElementById('lowResImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.low_res);
                    document.getElementById('mosaicImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.mosaic);
                    document.getElementById('colorMapImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.color_map);
                    
                    if (data.images.original_color_map) {
                        document.getElementById('originalColorMapImg').src = 
                            'data:image/png;base64,' + hexToBase64(data.images.original_color_map);
                        document.getElementById('originalColorMapCard').style.display = 'block';
                        document.getElementById('originalColorCountsTab').style.display = 'block';
                    } else {
                        document.getElementById('originalColorMapCard').style.display = 'none';
                        document.getElementById('originalColorCountsTab').style.display = 'none';
                    }
                    
                    renderColorList('colorCountsList', data.color_counts);
                    renderColorList('originalColorCountsList', data.original_color_counts);
                    
                    loading.classList.remove('show');
                    mainCard.style.display = 'none';
                    results.classList.add('show');
                } else {
                    alert('处理失败: ' + data.error);
                    loading.classList.remove('show');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
                loading.classList.remove('show');
            }
        });
        
        function hexToBase64(hex) {
            return btoa(hex.match(/\w{2}/g).map(a => String.fromCharCode(parseInt(a, 16))).join(''));
        }
        
        function renderColorList(elementId, colorCounts) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            
            const sortedColors = Object.entries(colorCounts)
                .sort((a, b) => b[1] - a[1]);
            
            sortedColors.forEach(([code, count]) => {
                const item = document.createElement('div');
                item.className = 'color-item';
                item.innerHTML = `
                    <div class="color-box" style="background-color: rgb(${getColorFromCode(code)})"></div>
                    <span class="color-code">${code}</span>
                    <span class="color-count">${count} 颗</span>
                `;
                container.appendChild(item);
            });
        }
        
        function getColorFromCode(code) {
            const rgb = mardColors[code];
            return rgb ? rgb.join(', ') : '255, 255, 255';
        }
        
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const type = btn.dataset.type;
                const imageData = currentImages[type];
                
                if (!imageData) return;
                
                try {
                    const response = await fetch('/download/' + type, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_data: imageData })
                    });
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const filenames = {
                        'low_res': '低分辨率图.png',
                        'mosaic': '马赛克效果.png',
                        'color_map': '颜色映射图.png',
                        'original_color_map': '简化前颜色映射图.png'
                    };
                    a.download = filenames[type] || 'image.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } catch (error) {
                    alert('下载失败: ' + error.message);
                }
            });
        });
        
        document.getElementById('downloadDouBtn').addEventListener('click', async () => {
            if (!currentDouData) return;
            
            try {
                const response = await fetch('/download-dou', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dou_data: currentDouData })
                });
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'template.dou';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        });
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                const tabContent = document.getElementById(tab.dataset.tab);
                if (tabContent) {
                    tabContent.classList.add('active');
                }
            });
        });
        
        document.getElementById('editTemplateBtn').addEventListener('click', () => {
            if (!currentDouData) return;
            loadDouData(currentDouData);
        });
        
        function loadDouData(douData) {
            currentDouData = douData;
            originalDouData = JSON.parse(JSON.stringify(douData));
            
            results.classList.remove('show');
            editor.classList.add('show');
            
            renderEditorCanvas();
            renderColorPicker();
            renderUsedColors();
        }
        
        function renderUsedColors() {
            const list = document.getElementById('usedColorsList');
            list.innerHTML = '';
            
            const colorCounts = countColors();
            const sortedColors = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]);
            
            sortedColors.forEach(([code, count]) => {
                const item = document.createElement('div');
                item.className = 'used-color-item';
                item.dataset.code = code;
                
                const colorBox = document.createElement('div');
                colorBox.className = 'used-color-box';
                const rgb = mardColors[code];
                colorBox.style.backgroundColor = `rgb(${rgb.join(', ')})`;
                
                const codeSpan = document.createElement('span');
                codeSpan.className = 'used-color-code';
                codeSpan.textContent = code;
                
                const countSpan = document.createElement('span');
                countSpan.className = 'used-color-count';
                countSpan.textContent = `${count}颗`;
                
                item.appendChild(colorBox);
                item.appendChild(codeSpan);
                item.appendChild(countSpan);
                
                item.addEventListener('click', () => {
                    highlightColor(code);
                });
                
                list.appendChild(item);
            });
        }
        
        function countColors() {
            const counts = {};
            const grid = currentDouData.grid;
            
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[y].length; x++) {
                    const code = grid[y][x];
                    if (code) {
                        counts[code] = (counts[code] || 0) + 1;
                    }
                }
            }
            
            return counts;
        }
        
        let highlightedColor = null;
        
        function highlightColor(code) {
            clearHighlight();
            
            if (highlightedColor === code) {
                highlightedColor = null;
                return;
            }
            
            highlightedColor = code;
            
            document.querySelectorAll('.used-color-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.code === code) {
                    item.classList.add('active');
                }
            });
            
            document.querySelectorAll('.canvas-cell').forEach(cell => {
                if (cell.textContent === code) {
                    cell.classList.add('highlighted');
                }
            });
        }
        
        function clearHighlight() {
            highlightedColor = null;
            
            document.querySelectorAll('.used-color-item').forEach(item => {
                item.classList.remove('active');
            });
            
            document.querySelectorAll('.canvas-cell').forEach(cell => {
                cell.classList.remove('highlighted');
            });
        }
        
        function renderEditorCanvas() {
            const canvas = document.getElementById('editorCanvas');
            canvas.innerHTML = '';
            
            const grid = currentDouData.grid;
            const h = grid.length;
            const w = grid[0].length;
            
            canvas.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
            
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'canvas-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    const code = grid[y][x];
                    if (code) {
                        const rgb = mardColors[code];
                        cell.style.backgroundColor = `rgb(${rgb.join(', ')})`;
                        cell.textContent = code;
                        cell.style.color = rgb.reduce((a, b) => a + b) > 382 ? '#000' : '#fff';
                    } else {
                        cell.classList.add('transparent');
                    }
                    
                    cell.addEventListener('click', () => {
                        toggleCellSelection(x, y);
                    });
                    
                    canvas.appendChild(cell);
                }
            }
        }
        
        function toggleCellSelection(x, y) {
            const cell = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
            const key = `${x},${y}`;
            const idx = selectedCells.indexOf(key);
            
            if (idx > -1) {
                selectedCells.splice(idx, 1);
                cell.classList.remove('selected');
            } else {
                selectedCells.push(key);
                cell.classList.add('selected');
            }
        }
        
        function renderColorPicker() {
            const grid = document.getElementById('colorPickerGrid');
            grid.innerHTML = '';
            
            const transparentBtn = document.createElement('div');
            transparentBtn.className = 'color-picker-item transparent-option';
            transparentBtn.title = '透明/删除';
            transparentBtn.textContent = '×';
            transparentBtn.addEventListener('click', () => selectColor(null));
            grid.appendChild(transparentBtn);
            
            const letterOrder = 'ABCDEFGHM';
            const colorGroups = {};
            
            letterOrder.split('').forEach(letter => {
                colorGroups[letter] = [];
            });
            
            Object.entries(mardColors).forEach(([code, rgb]) => {
                const letter = code.charAt(0);
                if (colorGroups[letter]) {
                    colorGroups[letter].push({ code, rgb });
                }
            });
            
            letterOrder.split('').forEach(letter => {
                const groupColors = colorGroups[letter];
                if (groupColors.length === 0) return;
                
                groupColors.sort((a, b) => {
                    const numA = parseInt(a.code.substring(1));
                    const numB = parseInt(b.code.substring(1));
                    return numA - numB;
                });
                
                const group = document.createElement('div');
                group.className = 'color-group';
                
                const header = document.createElement('div');
                header.className = 'color-group-header';
                header.textContent = `${letter}系列 (${groupColors.length}色)`;
                group.appendChild(header);
                
                const colorsContainer = document.createElement('div');
                colorsContainer.className = 'color-group-colors';
                
                groupColors.forEach(({ code, rgb }) => {
                    const item = document.createElement('div');
                    item.className = 'color-picker-item';
                    item.style.backgroundColor = `rgb(${rgb.join(', ')})`;
                    item.title = code;
                    item.dataset.code = code;
                    item.textContent = code;
                    item.style.color = rgb.reduce((a, b) => a + b) > 382 ? '#000' : '#fff';
                    
                    item.addEventListener('click', () => selectColor(code));
                    colorsContainer.appendChild(item);
                });
                
                group.appendChild(colorsContainer);
                grid.appendChild(group);
            });
        }
        
        let selectedColor = null;
        
        function selectColor(code) {
            document.querySelectorAll('.color-picker-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            if (code) {
                document.querySelector(`[data-code="${code}"]`).classList.add('selected');
            } else {
                document.querySelector('.transparent-option').classList.add('selected');
            }
            selectedColor = code;
        }
        
        document.getElementById('applyColorBtn').addEventListener('click', () => {
            if (selectedCells.length === 0) {
                alert('请先选择要编辑的格点');
                return;
            }
            
            selectedCells.forEach(key => {
                const [x, y] = key.split(',').map(Number);
                currentDouData.grid[y][x] = selectedColor;
                
                if (selectedColor) {
                    if (!currentDouData.color_map[selectedColor]) {
                        currentDouData.color_map[selectedColor] = mardColors[selectedColor];
                    }
                }
                
                const cell = document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
                if (selectedColor) {
                    const rgb = mardColors[selectedColor];
                    cell.style.backgroundColor = `rgb(${rgb.join(', ')})`;
                    cell.textContent = selectedColor;
                    cell.style.color = rgb.reduce((a, b) => a + b) > 382 ? '#000' : '#fff';
                    cell.classList.remove('transparent');
                } else {
                    cell.style.backgroundColor = '#fff';
                    cell.textContent = '';
                    cell.classList.add('transparent');
                }
            });
            
            selectedCells = [];
            document.querySelectorAll('.canvas-cell').forEach(cell => {
                cell.classList.remove('selected');
            });
            
            renderUsedColors();
        });
        
        document.getElementById('deleteSelectedBtn').addEventListener('click', () => {
            if (selectedCells.length === 0) {
                alert('请先选择要删除的格点');
                return;
            }
            
            selectColor(null);
            document.getElementById('applyColorBtn').click();
        });
        
        document.getElementById('clearHighlightBtn').addEventListener('click', () => {
            clearHighlight();
        });
        
        document.getElementById('previewEditedBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/dou-to-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dou_data: currentDouData })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const previewWindow = window.open();
                    previewWindow.document.write(`<img src="data:image/png;base64,${hexToBase64(data.image_data)}" style="max-width: 100%;">`);
                } else {
                    alert('预览失败: ' + data.error);
                }
            } catch (error) {
                alert('预览失败: ' + error.message);
            }
        });
        
        document.getElementById('downloadEditedDouBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/download-dou', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dou_data: currentDouData })
                });
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'template_edited.dou';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        });
        
        document.getElementById('compareBtn').addEventListener('click', async () => {
            const compareView = document.getElementById('compareView');
            
            if (compareView.style.display === 'none' || compareView.style.display === '') {
                try {
                    const originalResponse = await fetch('/dou-to-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dou_data: originalDouData })
                    });
                    const originalData = await originalResponse.json();
                    
                    const editedResponse = await fetch('/dou-to-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dou_data: currentDouData })
                    });
                    const editedData = await editedResponse.json();
                    
                    if (originalData.success && editedData.success) {
                        document.getElementById('beforePreview').src = 
                            'data:image/png;base64,' + hexToBase64(originalData.image_data);
                        document.getElementById('afterPreview').src = 
                            'data:image/png;base64,' + hexToBase64(editedData.image_data);
                        compareView.style.display = 'grid';
                    }
                } catch (error) {
                    alert('对比失败: ' + error.message);
                }
            } else {
                compareView.style.display = 'none';
            }
        });
        
        document.getElementById('backBtn').addEventListener('click', () => {
            editor.classList.remove('show');
            results.classList.remove('show');
            mainCard.style.display = 'block';
            selectedCells = [];
        });
    </script>
</body>
</html>
