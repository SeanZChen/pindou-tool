<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图片预处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .upload-area i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .upload-area p {
            color: #666;
            font-size: 16px;
        }
        
        .upload-area small {
            color: #999;
        }
        
        #fileInput {
            display: none;
        }
        
        .config-section {
            margin-top: 20px;
        }
        
        .config-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .config-item {
            display: flex;
            flex-direction: column;
        }
        
        .config-item label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .config-item input[type="number"],
        .config-item input[type="checkbox"] {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .config-item input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .config-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .image-card {
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }
        
        .image-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .image-card .image-header {
            padding: 12px 15px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .image-card .image-header h3 {
            font-size: 14px;
            color: #555;
            margin: 0;
        }
        
        .image-card img {
            width: 100%;
            display: block;
            max-height: 300px;
            object-fit: contain;
        }
        
        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .download-btn:hover {
            background: #5a6fd6;
        }
        
        .stats-section {
            margin-top: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .stat-card .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .color-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .color-item:hover {
            background: #f8f9fa;
        }
        
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            margin-right: 12px;
            border: 1px solid #ddd;
        }
        
        .color-code {
            font-weight: 600;
            color: #333;
            width: 50px;
        }
        
        .color-count {
            color: #666;
            margin-left: auto;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab:not(.active) {
            background: #f0f0f0;
            color: #666;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .config-row {
                grid-template-columns: 1fr;
            }
            
            .images-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 拼豆图片预处理工具</h1>
            <p>将图片转换为国产221色拼豆色卡映射</p>
        </div>
        
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <i>📷</i>
                <p>点击或拖拽上传图片</p>
                <small>支持 JPG、PNG 格式</small>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="config-section">
                <div class="config-row">
                    <div class="config-item">
                        <label for="size">下采样长边分辨率</label>
                        <input type="number" id="size" value="52" min="10" max="100">
                    </div>
                    <div class="config-item checkbox-label">
                        <input type="checkbox" id="simplify">
                        <label for="simplify">启用颜色简化模式</label>
                    </div>
                    <div class="config-item">
                        <label for="minCount">最小豆子数量阈值（<=此值的颜色将被合并）</label>
                        <input type="number" id="minCount" value="3" min="1" max="20">
                    </div>
                </div>
                
                <button class="btn" id="processBtn" disabled>开始处理</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在处理图片...</p>
            </div>
        </div>
        
        <div class="card results" id="results">
            <div class="section-title">处理结果</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="originalSize">-</div>
                    <div class="stat-label">原图尺寸</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="downsampledSize">-</div>
                    <div class="stat-label">降采样尺寸</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="colorCount">-</div>
                    <div class="stat-label">颜色种类</div>
                </div>
            </div>
            
            <div class="images-grid">
                <div class="image-card">
                    <div class="image-header">
                        <h3>低分辨率图</h3>
                        <button class="download-btn" data-type="low_res">下载</button>
                    </div>
                    <img id="lowResImg" alt="低分辨率图">
                </div>
                <div class="image-card">
                    <div class="image-header">
                        <h3>马赛克效果</h3>
                        <button class="download-btn" data-type="mosaic">下载</button>
                    </div>
                    <img id="mosaicImg" alt="马赛克效果">
                </div>
                <div class="image-card">
                    <div class="image-header">
                        <h3>颜色映射图</h3>
                        <button class="download-btn" data-type="color_map">下载</button>
                    </div>
                    <img id="colorMapImg" alt="颜色映射图">
                </div>
                <div class="image-card" id="originalColorMapCard" style="display: none;">
                    <div class="image-header">
                        <h3>简化前颜色映射图</h3>
                        <button class="download-btn" data-type="original_color_map">下载</button>
                    </div>
                    <img id="originalColorMapImg" alt="简化前颜色映射图">
                </div>
            </div>
            
            <div class="stats-section">
                <div class="tabs">
                    <button class="tab active" data-tab="colorCounts">颜色统计</button>
                    <button class="tab" data-tab="originalColorCounts" id="originalColorCountsTab" style="display: none;">简化前颜色统计</button>
                </div>
                
                <div class="tab-content active" id="colorCounts">
                    <div class="color-list" id="colorCountsList"></div>
                </div>
                <div class="tab-content" id="originalColorCounts">
                    <div class="color-list" id="originalColorCountsList"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        let uploadedFile = null;
        let currentImages = {};
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }
            uploadedFile = file;
            processBtn.disabled = false;
            uploadArea.innerHTML = `
                <i>✅</i>
                <p>已选择: ${file.name}</p>
                <small>点击更换图片</small>
            `;
        }
        
        processBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;
            
            const size = document.getElementById('size').value;
            const simplify = document.getElementById('simplify').checked;
            const minCount = document.getElementById('minCount').value;
            
            const formData = new FormData();
            formData.append('file', uploadedFile);
            formData.append('size', size);
            formData.append('simplify', simplify);
            formData.append('min_count', minCount);
            
            loading.classList.add('show');
            results.classList.remove('show');
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentImages = data.images;
                    
                    document.getElementById('originalSize').textContent = 
                        `${data.original_size[0]} × ${data.original_size[1]}`;
                    document.getElementById('downsampledSize').textContent = 
                        `${data.downsampled_size[0]} × ${data.downsampled_size[1]}`;
                    document.getElementById('colorCount').textContent = 
                        Object.keys(data.color_counts).length;
                    
                    document.getElementById('lowResImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.low_res);
                    document.getElementById('mosaicImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.mosaic);
                    document.getElementById('colorMapImg').src = 
                        'data:image/png;base64,' + hexToBase64(data.images.color_map);
                    
                    if (data.images.original_color_map) {
                        document.getElementById('originalColorMapImg').src = 
                            'data:image/png;base64,' + hexToBase64(data.images.original_color_map);
                        document.getElementById('originalColorMapCard').style.display = 'block';
                        document.getElementById('originalColorCountsTab').style.display = 'block';
                    } else {
                        document.getElementById('originalColorMapCard').style.display = 'none';
                        document.getElementById('originalColorCountsTab').style.display = 'none';
                    }
                    
                    renderColorList('colorCountsList', data.color_counts);
                    renderColorList('originalColorCountsList', data.original_color_counts);
                    
                    loading.classList.remove('show');
                    results.classList.add('show');
                } else {
                    alert('处理失败: ' + data.error);
                    loading.classList.remove('show');
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
                loading.classList.remove('show');
            }
        });
        
        function hexToBase64(hex) {
            return btoa(hex.match(/\w{2}/g).map(a => String.fromCharCode(parseInt(a, 16))).join(''));
        }
        
        function renderColorList(elementId, colorCounts) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            
            const sortedColors = Object.entries(colorCounts)
                .sort((a, b) => b[1] - a[1]);
            
            sortedColors.forEach(([code, count]) => {
                const item = document.createElement('div');
                item.className = 'color-item';
                item.innerHTML = `
                    <div class="color-box" style="background-color: rgb(${getColorFromCode(code)})"></div>
                    <span class="color-code">${code}</span>
                    <span class="color-count">${count} 颗</span>
                `;
                container.appendChild(item);
            });
        }

                'H17': (77, 68, 62), 'H18': (102, 96, 89), 'H19': (128, 122, 115), 'H20': (153, 147, 140),
                'H21': (178, 172, 166), 'H22': (204, 198, 192), 'H23': (229, 223, 217),
                'M1': (255, 204, 0), 'M2': (204, 153, 0), 'M3': (153, 102, 0), 'M4': (102, 77, 0),
                'M5': (77, 58, 0), 'M6': (255, 153, 0), 'M7': (255, 102, 0), 'M8': (204, 77, 0),
                'M9': (153, 51, 0), 'M10': (102, 38, 0), 'M11': (255, 0, 0), 'M12': (204, 0, 0),
                'M13': (153, 0, 0), 'M14': (102, 0, 0), 'M15': (77, 0, 0)
            };
            return mardColors[code] || '(255, 255, 255)';
        }
        
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const type = btn.dataset.type;
                const imageData = currentImages[type];
                
                if (!imageData) return;
                
                try {
                    const response = await fetch('/download/' + type, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_data: imageData })
                    });
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const filenames = {
                        'low_res': '低分辨率图.png',
                        'mosaic': '马赛克效果.png',
                        'color_map': '颜色映射图.png',
                        'original_color_map': '简化前颜色映射图.png'
                    };
                    a.download = filenames[type] || 'image.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                } catch (error) {
                    alert('下载失败: ' + error.message);
                }
            });
        });
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                const tabContent = document.getElementById(tab.dataset.tab);
                if (tabContent) {
                    tabContent.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
